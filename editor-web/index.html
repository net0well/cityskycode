<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- CSP: tudo local; sem rede (ADR-0007/S2). 'unsafe-inline'/'unsafe-eval' exigidos pelo Monaco. -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self';" />
    <title>City: SkyCode — Editor</title>
  </head>
  <body data-state="normal">
    <div id="app">
      <header id="toolbar">
        <span class="title">{ } Código</span>
        <div class="tabs">
          <button class="tab active" data-tab="code">Program.cs</button>
        </div>
        <div class="actions">
          <button id="btn-run" title="Executar (Ctrl+Enter)">▶ Executar</button>
          <button id="btn-expand" title="Expandir (Ctrl+Shift+`)">⤢</button>
          <button id="btn-minimize" title="Minimizar (Ctrl+`)">—</button>
        </div>
      </header>
      <div id="editor"></div>
      <section id="console">
        <div class="console-header">
          <span id="console-summary" class="summary">Pronto</span>
        </div>
        <ul id="console-lines"></ul>
      </section>
      <button id="collapsed-tab" title="Abrir o editor (Ctrl+`)">{ }</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
